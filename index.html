<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROAD MASTER AR : สายทางไร้หลุม</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- MediaPipe Face Mesh CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700;800&display=swap');
    * { font-family: 'Kanit', sans-serif; user-select: none; }
    body { background-color: #090d16; color: #f8fafc; overflow: hidden; }
    #webcam { display: none; }
    .glass-panel {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .neon-border {
      box-shadow: 0 0 15px rgba(250, 204, 21, 0.3);
    }
  </style>
</head>
<body class="w-screen h-screen flex items-center justify-center p-0 m-0 bg-slate-950">

  <!-- Container หลัก บังคับแนวตั้ง 9:16 Full Screen Vertical -->
  <div class="relative w-full h-full max-w-[540px] max-h-[960px] bg-slate-900 overflow-hidden flex flex-col justify-between shadow-2xl border-x border-slate-800">
    
    <!-- Hidden Webcam Video -->
    <video id="webcam" playsinline></video>

    <!-- Canvas เกมหลัก -->
    <canvas id="gameCanvas" width="540" height="960" class="absolute inset-0 w-full h-full z-10"></canvas>

    <!-- Overlay UI Screen (จัดการหน้าลงทะเบียน / สรุปคะแนน) -->
    <div id="uiOverlay" class="absolute inset-0 z-20 flex flex-col items-center justify-center p-6 glass-panel transition-all duration-300">
      
      <!-- 1. หน้าทดสอบกล้อง & ลงทะเบียน (Pre-Game Registration) -->
      <div id="setupScreen" class="w-full flex flex-col items-center space-y-4 text-center">
        <div class="bg-yellow-500/10 border border-yellow-500/30 px-4 py-1 rounded-full text-yellow-400 text-xs font-bold tracking-wider uppercase">
          AR Inspector Game
        </div>
        <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 via-amber-300 to-orange-500 drop-shadow">
          ROAD MASTER AR
        </h1>
        <p class="text-slate-400 text-xs -mt-2">เกมสแกนสายทางหลบหลุมถนน (แนวตั้ง 1080p)</p>

        <!-- จอลองกล้อง Video Preview Box -->
        <div class="relative w-64 h-48 bg-slate-950 rounded-2xl border-2 border-yellow-400/50 overflow-hidden shadow-lg flex items-center justify-center my-2">
          <canvas id="previewCanvas" width="256" height="192" class="w-full h-full object-cover transform -scale-x-100"></canvas>
          <div id="cameraStatusBadge" class="absolute top-2 left-2 bg-slate-900/80 px-2 py-0.5 rounded text-[10px] text-yellow-400 font-medium">
            ⏳ กำลังเชื่อมต่อกล้อง...
          </div>
        </div>

        <!-- เลือกอุปกรณ์กล้อง -->
        <div class="w-full max-w-xs text-left">
          <label class="text-xs text-slate-400 mb-1 block">🎥 เลือกกล้องที่ใช้งาน:</label>
          <select id="cameraSelect" class="w-full bg-slate-800 border border-slate-700 text-slate-200 text-xs rounded-lg p-2.5 focus:ring-yellow-400 focus:border-yellow-400">
            <option value="">กำลังค้นหากล้อง...</option>
          </select>
        </div>

        <!-- ช่องกรอกชื่อ -->
        <div class="w-full max-w-xs text-left">
          <label class="text-xs text-slate-400 mb-1 block">👤 ชื่อวิศวกร / ผู้เล่น:</label>
          <input type="text" id="playerNameInput" placeholder="กรอกชื่อผู้เล่น..." value="นายช่างบอย" 
                 class="w-full bg-slate-800 border border-slate-700 text-yellow-400 font-bold text-sm rounded-lg p-2.5 focus:ring-yellow-400 focus:border-yellow-400 text-center">
        </div>

        <!-- ปุ่มถ่ายรูปสแกนหน้า + เริ่มเล่น -->
        <button id="btnStartGame" onclick="confirmAndStartGame()" 
                class="w-full max-w-xs bg-gradient-to-r from-yellow-500 to-amber-600 hover:from-yellow-400 hover:to-amber-500 text-slate-950 font-black text-base py-3.5 px-6 rounded-xl shadow-lg transition-all transform active:scale-95 flex items-center justify-center gap-2 mt-2">
          <span>🚀 ลงทะเบียน & เริ่มลุยสายทาง</span>
        </button>
      </div>

      <!-- 2. หน้าสรุปผลหลังเล่นเสร็จ + TOP 10 LEADERBOARD -->
      <div id="gameOverScreen" class="w-full flex flex-col items-center hidden space-y-3 text-center my-auto">
        <h2 class="text-2xl font-black text-red-500 tracking-wide">🏁 สรุปผลการสำรวจสายทาง</h2>
        
        <div class="bg-slate-800/80 border border-slate-700 rounded-xl p-3 w-full max-w-xs flex items-center justify-between">
          <div class="text-left">
            <div id="resultPlayerName" class="font-bold text-slate-200 text-sm">วิศวกร: -</div>
            <div id="resultScore" class="text-xl font-black text-yellow-400">0 คะแนน</div>
          </div>
          <img id="resultPlayerImg" class="w-12 h-12 rounded-full object-cover border-2 border-yellow-400 bg-slate-900" src="" alt="Player"/>
        </div>

        <!-- ตาราง TOP 10 LEADERBOARD -->
        <div class="w-full max-w-xs bg-slate-950/80 border border-slate-800 rounded-xl p-3 text-left">
          <h3 class="text-xs font-bold text-yellow-400 mb-2 flex items-center justify-between">
            <span>🏆 TOP 10 อันดับสูงสุด</span>
            <span class="text-[10px] text-slate-500">Supabase DB</span>
          </h3>
          <div id="leaderboardList" class="space-y-1.5 max-h-48 overflow-y-auto pr-1 text-xs">
            <div class="text-slate-500 italic text-center py-2">กำลังโหลดตารางคะแนน...</div>
          </div>
        </div>

        <button onclick="resetToSetup()" 
                class="w-full max-w-xs bg-slate-800 hover:bg-slate-700 border border-slate-600 text-yellow-400 font-bold py-3 rounded-xl transition-all active:scale-95">
          🔄 กลับหน้าหลัก / เปลี่ยนผู้เล่น
        </button>
      </div>

    </div>
  </div>

  <script>
    // --- SUPABASE CONFIGURATION ---
    const SUPABASE_URL = "https://apkcsssacamoxrobvcnw.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFwa2Nzc3NhY2Ftb3hyb2J2Y253Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyNTYwNzksImV4cCI6MjEwNTgzMjA3OX0.QraPn33RKDNQlXnMhlchLtBl4kTfCVdurZLNb6Gmnjs";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // --- DOM ELEMENTS ---
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('gameCanvas');
    const ctx = canvasElement.getContext('2d');
    const previewCanvas = document.getElementById('previewCanvas');
    const pCtx = previewCanvas.getContext('2d');
    const cameraSelect = document.getElementById('cameraSelect');
    const cameraStatusBadge = document.getElementById('cameraStatusBadge');
    
    const uiOverlay = document.getElementById('uiOverlay');
    const setupScreen = document.getElementById('setupScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');

    // --- GAME STATE & VARIABLES ---
    let gameState = 'SETUP'; // SETUP, PLAYING, GAMEOVER
    let score = 0;
    let timeLeft = 60;
    let timerInterval = null;
    let playerName = 'นายช่างบอย';
    let playerPhotoBlob = null;
    let playerPhotoPublicUrl = null;

    // Lane Settings (4 Lanes Vertical)
    const laneWidth = 110;
    const roadLeftX = (canvasElement.width - (laneWidth * 4)) / 2;
    const laneCenters = [
      roadLeftX + laneWidth * 0.5,
      roadLeftX + laneWidth * 1.5,
      roadLeftX + laneWidth * 2.5,
      roadLeftX + laneWidth * 3.5
    ];
    let currentLane = 1;

    let obstacles = [];
    let roadSpeed = 8;
    let roadOffset = 0;
    let headX = 0.5;
    let currentStream = null;

    // --- MEDIAPIPE FACE MESH ---
    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });

    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: false,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });

    faceMesh.onResults(onFaceMeshResults);

    // --- CAMERA MANAGEMENT ---
    async function initCameraDevices() {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const videoDevices = devices.filter(d => d.kind === 'videoinput');
        
        cameraSelect.innerHTML = '';
        videoDevices.forEach((device, idx) => {
          const opt = document.createElement('option');
          opt.value = device.deviceId;
          opt.text = device.label || `กล้องตัวที่ ${idx + 1}`;
          cameraSelect.appendChild(opt);
        });

        if (videoDevices.length > 0) {
          startCameraStream(videoDevices[0].deviceId);
        }
      } catch (err) {
        cameraStatusBadge.innerText = "❌ ไม่พบกล้อง";
      }
    }

    async function startCameraStream(deviceId) {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }

      const constraints = {
        video: deviceId ? { deviceId: { exact: deviceId }, width: 640, height: 480 } : true
      };

      try {
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        videoElement.srcObject = currentStream;
        await videoElement.play();
        cameraStatusBadge.innerText = "🟢 กล้องพร้อมทำงาน";
        cameraStatusBadge.className = "absolute top-2 left-2 bg-green-950/80 border border-green-500/50 px-2 py-0.5 rounded text-[10px] text-green-400 font-medium";
        
        // Loop ประมวลผล MediaPipe
        processVideoFrame();
      } catch (err) {
        cameraStatusBadge.innerText = "❌ ไม่สามารถเปิดกล้องได้";
      }
    }

    cameraSelect.addEventListener('change', (e) => {
      startCameraStream(e.target.value);
    });

    async function processVideoFrame() {
      if (!videoElement.paused && !videoElement.ended) {
        await faceMesh.send({ image: videoElement });
        requestAnimationFrame(processVideoFrame);
      }
    }

    function onFaceMeshResults(results) {
      // หน้าจอ Preview กล้องในขั้นตอนลงทะเบียน
      if (gameState === 'SETUP') {
        pCtx.save();
        pCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
        pCtx.drawImage(results.image, 0, 0, previewCanvas.width, previewCanvas.height);
        
        // ถ้าเจอหน้า ให้วาดหมวกจำลองลองสวม
        if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
          const nose = results.multiFaceLandmarks[0][1];
          const x = (1.0 - nose.x) * previewCanvas.width;
          const y = nose.y * previewCanvas.height;
          drawSafetyHelmet(pCtx, x, y - 20, 0.7);
        }
        pCtx.restore();
      }

      // เล่นเกมจริง
      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const nose = results.multiFaceLandmarks[0][1];
        headX = 1.0 - nose.x;

        if (headX < 0.38) currentLane = 0;
        else if (headX < 0.50) currentLane = 1;
        else if (headX < 0.62) currentLane = 2;
        else currentLane = 3;
      }

      if (gameState === 'PLAYING') {
        ctx.save();
        ctx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        updateGameLogic();
        drawGameScene();
        ctx.restore();
      }
    }

    // --- GAME CONTROLS ---
    async function confirmAndStartGame() {
      const inputName = document.getElementById('playerNameInput').value.trim();
      if (!inputName) {
        alert("กรุณากรอกชื่อวิศวกรผู้เล่น!");
        return;
      }
      playerName = inputName;

      // แคปรูปถ่ายผู้เล่นลง Blob
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = 256;
      tempCanvas.height = 256;
      const tCtx = tempCanvas.getContext('2d');
      tCtx.drawImage(videoElement, 0, 0, 256, 256);
      playerPhotoBlob = await new Promise(res => tempCanvas.toBlob(res, 'image/jpeg', 0.85));

      // ซ่อน Overlay เริ่มเล่น
      uiOverlay.classList.add('hidden');
      gameState = 'PLAYING';
      score = 0;
      timeLeft = 60;
      obstacles = [];

      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeLeft--;
        if (timeLeft <= 0) endGame();
      }, 1000);
    }

    function endGame() {
      gameState = 'GAMEOVER';
      clearInterval(timerInterval);
      
      uiOverlay.classList.remove('hidden');
      setupScreen.classList.add('hidden');
      gameOverScreen.classList.remove('hidden');

      document.getElementById('resultPlayerName').innerText = `วิศวกร: ${playerName}`;
      document.getElementById('resultScore').innerText = `${score} คะแนน`;

      // แสดงภาพพรีวิวรูปถ่าย
      if (playerPhotoBlob) {
        document.getElementById('resultPlayerImg').src = URL.createObjectURL(playerPhotoBlob);
      }

      uploadScoreAndFetchLeaderboard();
    }

    function resetToSetup() {
      gameState = 'SETUP';
      setupScreen.classList.remove('hidden');
      gameOverScreen.classList.add('hidden');
    }

    // --- SUPABASE DATA HANDLER ---
    async function uploadScoreAndFetchLeaderboard() {
      const listContainer = document.getElementById('leaderboardList');
      listContainer.innerHTML = `<div class="text-xs text-yellow-400 animate-pulse text-center py-2">⏳ กำลังบันทึกคะแนน...</div>`;

      try {
        let photoUrl = null;
        if (playerPhotoBlob) {
          const fileName = `inspector_${Date.now()}.jpg`;
          const { error: storageErr } = await supabaseClient
            .storage.from('player-photos').upload(fileName, playerPhotoBlob);

          if (!storageErr) {
            const { data } = supabaseClient.storage.from('player-photos').getPublicUrl(fileName);
            photoUrl = data.publicUrl;
          }
        }

        // Insert คะแนน
        await supabaseClient.from('leaderboard').insert([{
          player_name: playerName,
          score: score,
          photo_url: photoUrl
        }]);

        // ดึง TOP 10
        const { data: top10, error: dbErr } = await supabaseClient
          .from('leaderboard')
          .select('*')
          .order('score', { ascending: false })
          .limit(10);

        if (dbErr) throw dbErr;

        if (top10 && top10.length > 0) {
          listContainer.innerHTML = top10.map((item, idx) => `
            <div class="flex items-center justify-between bg-slate-900/80 p-1.5 rounded border border-slate-800">
              <div class="flex items-center gap-2 overflow-hidden">
                <span class="font-black text-xs ${idx === 0 ? 'text-yellow-400' : (idx === 1 ? 'text-slate-300' : (idx === 2 ? 'text-amber-600' : 'text-slate-500'))}">
                  #${idx + 1}
                </span>
                ${item.photo_url ? `<img src="${item.photo_url}" class="w-6 h-6 rounded-full object-cover border border-yellow-500/50 shrink-0"/>` : '<div class="w-6 h-6 rounded-full bg-slate-800 border border-slate-700"></div>'}
                <span class="font-medium text-slate-200 text-xs truncate">${item.player_name}</span>
              </div>
              <span class="font-bold text-yellow-400 text-xs ml-1 shrink-0">${item.score} pt</span>
            </div>
          `).join('');
        }
      } catch (err) {
        console.error(err);
        listContainer.innerHTML = `<div class="text-xs text-red-400 text-center">โหลดสถิติล้มเหลว</div>`;
      }
    }

    // --- GAME ENGINE LOGIC & DRAWING ---
    function updateGameLogic() {
      roadOffset = (roadOffset + roadSpeed) % 60;

      if (Math.random() < 0.045) {
        const randomLane = Math.floor(Math.random() * 4);
        const type = Math.random() > 0.25 ? 'POTHOLE' : 'TIME_BONUS';
        obstacles.push({ lane: randomLane, y: -60, type: type });
      }

      for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.y += roadSpeed;

        // Collision Check
        if (obs.y > 760 && obs.y < 840 && obs.lane === currentLane) {
          if (obs.type === 'POTHOLE') {
            score = Math.max(0, score - 50);
          } else if (obs.type === 'TIME_BONUS') {
            score += 100;
            timeLeft += 3;
          }
          obstacles.splice(i, 1);
          continue;
        }

        if (obs.y > canvasElement.height) {
          if (obs.type === 'POTHOLE') score += 10;
          obstacles.splice(i, 1);
        }
      }
    }

    function drawGameScene() {
      // 1. ถนนแนวตั้ง 4 เลน
      ctx.fillStyle = "#1e293b";
      ctx.fillRect(roadLeftX, 0, laneWidth * 4, canvasElement.height);

      // เส้นขอบทางเดินสีเหลือง-ดำ สไตล์เขตก่อสร้าง
      ctx.fillStyle = "#facc15";
      ctx.fillRect(roadLeftX - 10, 0, 10, canvasElement.height);
      ctx.fillRect(roadLeftX + laneWidth * 4, 0, 10, canvasElement.height);

      // เส้นแบ่งเลนถนน
      ctx.strokeStyle = "#64748b";
      ctx.lineWidth = 4;
      ctx.setLineDash([30, 30]);
      ctx.lineDashOffset = -roadOffset;

      for (let i = 1; i < 4; i++) {
        ctx.beginPath();
        ctx.moveTo(roadLeftX + laneWidth * i, 0);
        ctx.lineTo(roadLeftX + laneWidth * i, canvasElement.height);
        ctx.stroke();
      }
      ctx.setLineDash([]);

      // 2. วาดอุปสรรค
      obstacles.forEach(obs => {
        const x = laneCenters[obs.lane];
        if (obs.type === 'POTHOLE') {
          draw3DPothole(x, obs.y);
        } else if (obs.type === 'TIME_BONUS') {
          drawGlowTimeBonus(x, obs.y);
        }
      });

      // 3. วาดตัวละครผู้เล่น (การ์ตูนนายช่างสวมหมวก AR)
      const playerX = laneCenters[currentLane];
      const playerY = 810;
      drawCuteInspector(playerX, playerY);

      // 4. HUD คะแนน และ เวลา แบบ Neon Glass Top Floating
      ctx.fillStyle = "rgba(15, 23, 42, 0.9)";
      ctx.fillRect(20, 20, canvasElement.width - 40, 70);
      ctx.strokeStyle = "#facc15";
      ctx.lineWidth = 2;
      ctx.strokeRect(20, 20, canvasElement.width - 40, 70);

      ctx.fillStyle = "#facc15";
      ctx.font = "bold 20px Kanit";
      ctx.textAlign = "left";
      ctx.fillText(`คะแนน: ${score}`, 40, 60);

      ctx.fillStyle = "#ffffff";
      ctx.textAlign = "right";
      ctx.fillText(`เวลา: ${timeLeft}s`, canvasElement.width - 40, 60);
    }

    // --- GRAPHICS DRAWING FUNCTIONS ---
    
    // วาดหลุมถนน 3D พร้อมรอยแตกร้าว
    function draw3DPothole(x, y) {
      // เงาหลุมด้านนอก
      ctx.fillStyle = "#090d16";
      ctx.beginPath();
      ctx.ellipse(x, y + 4, 38, 22, 0, 0, Math.PI * 2);
      ctx.fill();

      // ปากหลุมหลัก
      ctx.fillStyle = "#020617";
      ctx.beginPath();
      ctx.ellipse(x, y, 36, 20, 0, 0, Math.PI * 2);
      ctx.fill();

      // ขอบมิติหลุมลึก
      ctx.strokeStyle = "#475569";
      ctx.lineWidth = 3;
      ctx.stroke();

      // รอยแตกหักถนนรอบหลุม (Cracks)
      ctx.strokeStyle = "#ef4444";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x - 36, y); ctx.lineTo(x - 48, y - 6);
      ctx.moveTo(x + 36, y); ctx.lineTo(x + 46, y + 8);
      ctx.moveTo(x, y - 20); ctx.lineTo(x + 6, y - 30);
      ctx.stroke();
    }

    // วาดไอคอนเพิ่มเวลาเรืองแสง (Glowing Clock Icon)
    function drawGlowTimeBonus(x, y) {
      // Glow Effect
      ctx.shadowColor = "#facc15";
      ctx.shadowBlur = 15;

      ctx.fillStyle = "#facc15";
      ctx.beginPath();
      ctx.arc(x, y, 22, 0, Math.PI * 2);
      ctx.fill();

      ctx.shadowBlur = 0; // reset

      ctx.fillStyle = "#0f172a";
      ctx.font = "black 14px Kanit";
      ctx.textAlign = "center";
      ctx.fillText("+3s", x, y + 5);
    }

    // วาดตัวละครนายช่างน่ารัก (Cute Inspector Mascot)
    function drawCuteInspector(x, y) {
      // ร่างกายการ์ตูน
      ctx.fillStyle = "#2563eb"; // ชุดเสื้อช่างสีน้ำเงิน
      ctx.beginPath();
      ctx.roundRect(x - 22, y - 10, 44, 40, 10);
      ctx.fill();

      // หัวตัวละคร
      ctx.fillStyle = "#fde047";
      ctx.beginPath();
      ctx.arc(x, y - 20, 18, 0, Math.PI * 2);
      ctx.fill();

      // หมวกเซฟตี้ AR
      drawSafetyHelmet(ctx, x, y - 28, 1.0);
    }

    // วาดหมวกเซฟตี้ก่อสร้างสีเหลืองทรงโมเดิร์น
    function drawSafetyHelmet(targetCtx, x, y, scale = 1.0) {
      targetCtx.save();
      targetCtx.translate(x, y);
      targetCtx.scale(scale, scale);

      // โดมหมวก
      targetCtx.fillStyle = "#facc15";
      targetCtx.beginPath();
      targetCtx.arc(0, 0, 24, Math.PI, 0);
      targetCtx.fill();

      // ขอบปีกหมวก
      targetCtx.fillStyle = "#eab308";
      targetCtx.beginPath();
      targetCtx.roundRect(-30, -2, 60, 8, 4);
      targetCtx.fill();

      // แถบสะท้อนแสงบนหมวก
      targetCtx.fillStyle = "#ffffff";
      targetCtx.fillRect(-8, -18, 16, 5);

      targetCtx.restore();
    }

    // Initialize Camera on Load
    initCameraDevices();
  </script>

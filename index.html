<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เกมสำรวจสายทางกองช่าง AR - อบต.</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- MediaPipe Face Mesh CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&display=swap');
    body { font-family: 'Kanit', sans-serif; background-color: #0f172a; color: #f8fafc; }
    #webcam { display: none; }
    #gameCanvas { border-radius: 1rem; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

  <!-- Header -->
  <div class="w-full max-w-5xl flex justify-between items-center mb-3 px-2">
    <div>
      <h1 class="text-2xl font-bold text-yellow-400 flex items-center gap-2">
        🏗️ เกมสำรวจสายทางกองช่าง <span class="text-xs bg-yellow-500 text-slate-900 px-2 py-0.5 rounded font-bold">AR + Supabase</span>
      </h1>
      <p class="text-xs text-slate-400">เอียงศีรษะ ซ้าย-ขวา เพื่อเปลี่ยนเลนหลบหลุมถนนชำรุด!</p>
    </div>
    <div class="text-right bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700">
      <div id="statusText" class="text-xs font-semibold text-yellow-400">กำลังโหลดระบบ...</div>
    </div>
  </div>

  <!-- Main Game Container (Canvas + Leaderboard) -->
  <div class="w-full max-w-5xl flex flex-col md:flex-row gap-4 items-start justify-center">
    
    <!-- Game Canvas -->
    <div class="relative w-full md:w-3/4 flex justify-center items-center">
      <video id="webcam" playsinline></video>
      <canvas id="gameCanvas" width="700" height="480" class="bg-slate-900 border-2 border-slate-700 w-full h-auto"></canvas>
    </div>

    <!-- Leaderboard Side Panel (Supabase Real-time) -->
    <div class="w-full md:w-1/4 bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-xl">
      <h2 class="text-lg font-bold text-yellow-400 mb-3 flex items-center gap-2">
        🏆 Top 5 อันดับสูงสุด
      </h2>
      <div id="leaderboardList" class="space-y-2 text-sm">
        <div class="text-xs text-slate-400 italic">กำลังโหลดคะแนนจาก Supabase...</div>
      </div>
    </div>

  </div>

  <script>
    // --- SUPABASE CONFIGURATION (AUTOMATED) ---
    const SUPABASE_URL = "https://apkcsssacamoxrobvcnw.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFwa2Nzc3NhY2Ftb3hyb2J2Y253Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyNTYwNzksImV4cCI6MjEwNTgzMjA3OX0.QraPn33RKDNQlXnMhlchLtBl4kTfCVdurZLNb6Gmnjs";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // --- DOM ELEMENTS ---
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('gameCanvas');
    const ctx = canvasElement.getContext('2d');
    const statusText = document.getElementById('statusText');
    const leaderboardList = document.getElementById('leaderboardList');

    // --- GAME VARIABLES ---
    let gameState = 'START'; // START, PLAYING, GAMEOVER
    let score = 0;
    let timeLeft = 60;
    let timerInterval = null;
    let playerName = '';

    // Lane Settings (4 Lanes)
    const laneWidth = 120;
    const roadLeftX = (canvasElement.width - (laneWidth * 4)) / 2;
    const laneCenters = [
      roadLeftX + laneWidth * 0.5,
      roadLeftX + laneWidth * 1.5,
      roadLeftX + laneWidth * 2.5,
      roadLeftX + laneWidth * 3.5
    ];
    let currentLane = 1;

    // Obstacles & Items
    let obstacles = [];
    let roadSpeed = 6;
    let roadOffset = 0;
    let headX = 0.5;

    // --- MEDIAPIPE FACE MESH SETUP ---
    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });

    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: false,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });

    faceMesh.onResults(onFaceMeshResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await faceMesh.send({ image: videoElement });
      },
      width: 640,
      height: 480
    });
    camera.start();

    // โหลด Leaderboard ครั้งแรก
    fetchLeaderboard();

    function onFaceMeshResults(results) {
      ctx.save();
      ctx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        statusText.innerText = "🟢 AI พร้อมทำงาน - เอียงหัวเพื่อควบคุม";
        statusText.className = "text-xs font-semibold text-green-400";

        const landmarks = results.multiFaceLandmarks[0];
        const nose = landmarks[1];
        headX = 1.0 - nose.x; // Mirror

        if (headX < 0.38) currentLane = 0;
        else if (headX < 0.50) currentLane = 1;
        else if (headX < 0.62) currentLane = 2;
        else currentLane = 3;

      } else {
        statusText.innerText = "🔴 ไม่พบใบหน้า กรุณายืนหน้ากล้อง";
        statusText.className = "text-xs font-semibold text-red-400";
      }

      if (gameState === 'START') {
        drawStartScreen(results.image);
      } else if (gameState === 'PLAYING') {
        updateGameLogic();
        drawGameScene(results.image);
      } else if (gameState === 'GAMEOVER') {
        drawGameOverScreen();
      }

      ctx.restore();
    }

    // --- SUPABASE API FUNCTIONS ---
    async function fetchLeaderboard() {
      try {
        const { data, error } = await supabaseClient
          .from('leaderboard')
          .select('*')
          .order('score', { ascending: false })
          .limit(5);

        if (error) throw error;

        if (data && data.length > 0) {
          leaderboardList.innerHTML = data.map((item, idx) => `
            <div class="flex items-center justify-between bg-slate-700/50 p-2 rounded border border-slate-600">
              <div class="flex items-center gap-2 overflow-hidden">
                <span class="font-bold ${idx === 0 ? 'text-yellow-400' : 'text-slate-300'}">#${idx + 1}</span>
                ${item.photo_url ? `<img src="${item.photo_url}" class="w-8 h-8 rounded-full object-cover border border-yellow-400 shrink-0"/>` : ''}
                <span class="font-medium text-slate-200 truncate">${item.player_name}</span>
              </div>
              <span class="font-bold text-yellow-400 ml-2 shrink-0">${item.score} pt</span>
            </div>
          `).join('');
        } else {
          leaderboardList.innerHTML = `<div class="text-xs text-slate-400">ยังไม่มีสถิติคะแนน</div>`;
        }
      } catch (err) {
        console.error("Supabase Error:", err);
      }
    }

    async function uploadPhotoAndSaveScore() {
      statusText.innerText = "⏳ กำลังบันทึกคะแนนลง Supabase...";
      statusText.className = "text-xs font-semibold text-yellow-400";

      let uploadedPublicUrl = null;

      try {
        // 1. แคปภาพจากกล้อง แปลงเป็น Blob
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = 320;
        tempCanvas.height = 240;
        const tCtx = tempCanvas.getContext('2d');
        tCtx.drawImage(videoElement, 0, 0, 320, 240);

        const blob = await new Promise(resolve => tempCanvas.toBlob(resolve, 'image/jpeg', 0.8));
        const fileName = `player_${Date.now()}.jpg`;

        // 2. อัปโหลดรูปขึ้น Supabase Storage
        const { data: storageData, error: storageError } = await supabaseClient
          .storage
          .from('player-photos')
          .upload(fileName, blob);

        if (!storageError) {
          const { data: publicUrlData } = supabaseClient
            .storage
            .from('player-photos')
            .getPublicUrl(fileName);
          uploadedPublicUrl = publicUrlData.publicUrl;
        }

        // 3. บันทึกข้อมูลลงตาราง leaderboard
        const { error: dbError } = await supabaseClient
          .from('leaderboard')
          .insert([{
            player_name: playerName,
            score: score,
            photo_url: uploadedPublicUrl
          }]);

        if (dbError) throw dbError;

        statusText.innerText = "🟢 บันทึกคะแนนสำเร็จ!";
        statusText.className = "text-xs font-semibold text-green-400";

        // โหลดคะแนนใหม่ขึ้นข้างจอ
        fetchLeaderboard();

      } catch (err) {
        console.error("Save Error:", err);
        statusText.innerText = "🔴 บันทึกคะแนนไม่สำเร็จ (เช็ก RLS/Bucket)";
        statusText.className = "text-xs font-semibold text-red-400";
      }
    }

    // --- GAME LOGIC & DRAWING ---
    function startGame() {
      const input = prompt("กรุณากรอกชื่อวิศวกร/นายช่างผู้เล่น:", "ช่างบอย");
      if (!input) return;
      playerName = input;

      score = 0;
      timeLeft = 60;
      obstacles = [];
      gameState = 'PLAYING';

      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeLeft--;
        if (timeLeft <= 0) endGame();
      }, 1000);
    }

    function endGame() {
      gameState = 'GAMEOVER';
      clearInterval(timerInterval);
      uploadPhotoAndSaveScore();
    }

    function updateGameLogic() {
      roadOffset = (roadOffset + roadSpeed) % 40;

      if (Math.random() < 0.04) {
        const randomLane = Math.floor(Math.random() * 4);
        const type = Math.random() > 0.25 ? 'POTHOLE' : 'TIME_BONUS';
        obstacles.push({ lane: randomLane, y: -50, type: type });
      }

      for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.y += roadSpeed;

        if (obs.y > 360 && obs.y < 420 && obs.lane === currentLane) {
          if (obs.type === 'POTHOLE') {
            score = Math.max(0, score - 50);
          } else if (obs.type === 'TIME_BONUS') {
            score += 100;
            timeLeft += 3;
          }
          obstacles.splice(i, 1);
          continue;
        }

        if (obs.y > canvasElement.height) {
          if (obs.type === 'POTHOLE') score += 10;
          obstacles.splice(i, 1);
        }
      }
    }

    function drawGameScene(webcamImage) {
      // วาดถนน 4 เลน
      ctx.fillStyle = "#334155";
      ctx.fillRect(roadLeftX, 0, laneWidth * 4, canvasElement.height);

      ctx.strokeStyle = "#cbd5e1";
      ctx.lineWidth = 4;
      ctx.setLineDash([20, 20]);
      ctx.lineDashOffset = -roadOffset;

      for (let i = 1; i < 4; i++) {
        ctx.beginPath();
        ctx.moveTo(roadLeftX + laneWidth * i, 0);
        ctx.lineTo(roadLeftX + laneWidth * i, canvasElement.height);
        ctx.stroke();
      }
      ctx.setLineDash([]);

      // วาดอุปสรรค
      obstacles.forEach(obs => {
        const x = laneCenters[obs.lane];
        if (obs.type === 'POTHOLE') {
          ctx.fillStyle = "#0f172a";
          ctx.beginPath();
          ctx.ellipse(x, obs.y, 30, 18, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = "#ef4444";
          ctx.lineWidth = 2;
          ctx.stroke();
        } else if (obs.type === 'TIME_BONUS') {
          ctx.fillStyle = "#facc15";
          ctx.beginPath();
          ctx.arc(x, obs.y, 18, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#000000";
          ctx.font = "bold 12px Kanit";
          ctx.textAlign = "center";
          ctx.fillText("+3s", x, obs.y + 4);
        }
      });

      // วาดผู้เล่น + หมวกเซฟตี้ AR
      const playerX = laneCenters[currentLane];
      const playerY = 400;

      ctx.fillStyle = "#3b82f6";
      ctx.beginPath();
      ctx.roundRect(playerX - 25, playerY - 25, 50, 50, 8);
      ctx.fill();

      // หมวก AR
      ctx.fillStyle = "#facc15";
      ctx.beginPath();
      ctx.arc(playerX, playerY - 8, 22, Math.PI, 0);
      ctx.fill();
      ctx.fillRect(playerX - 28, playerY - 8, 56, 6);

      // วาดจอกล้องเล็ก (PiP)
      if (webcamImage) {
        ctx.drawImage(webcamImage, canvasElement.width - 150, 10, 140, 105);
        ctx.strokeStyle = "#facc15";
        ctx.lineWidth = 2;
        ctx.strokeRect(canvasElement.width - 150, 10, 140, 105);
      }

      // HUD คะแนน / เวลา
      ctx.fillStyle = "#0f172a";
      ctx.fillRect(10, 10, 200, 65);
      ctx.strokeStyle = "#334155";
      ctx.strokeRect(10, 10, 200, 65);

      ctx.fillStyle = "#facc15";
      ctx.font = "bold 16px Kanit";
      ctx.textAlign = "left";
      ctx.fillText(`คะแนน: ${score}`, 20, 33);
      ctx.fillStyle = "#ffffff";
      ctx.fillText(`เวลาคงเหลือ: ${timeLeft}s`, 20, 60);
    }

    function drawStartScreen(webcamImage) {
      if (webcamImage) {
        ctx.drawImage(webcamImage, 0, 0, canvasElement.width, canvasElement.height);
      }

      ctx.fillStyle = "rgba(15, 23, 42, 0.85)";
      ctx.fillRect(0, 0, canvasElement.width, canvasElement.height);

      ctx.fillStyle = "#facc15";
      ctx.font = "bold 28px Kanit";
      ctx.textAlign = "center";
      ctx.fillText("🏗️ เกมสำรวจสายทางกองช่าง AR", canvasElement.width / 2, 170);

      ctx.fillStyle = "#ffffff";
      ctx.font = "16px Kanit";
      ctx.fillText("ยืนหน้ากล้อง แล้วเอียงศีรษะ ซ้าย-ขวา เพื่อหลบหลุมถนน", canvasElement.width / 2, 215);

      ctx.fillStyle = "#22c55e";
      ctx.beginPath();
      ctx.roundRect(canvasElement.width / 2 - 90, 260, 180, 45, 10);
      ctx.fill();

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 18px Kanit";
      ctx.fillText("คลิกเพื่อเริ่มเล่น", canvasElement.width / 2, 288);
    }

    function drawGameOverScreen() {
      ctx.fillStyle = "rgba(15, 23, 42, 0.95)";
      ctx.fillRect(0, 0, canvasElement.width, canvasElement.height);

      ctx.fillStyle = "#ef4444";
      ctx.font = "bold 32px Kanit";
      ctx.textAlign = "center";
      ctx.fillText("🏁 สิ้นสุดการสำรวจสายทาง!", canvasElement.width / 2, 150);

      ctx.fillStyle = "#ffffff";
      ctx.font = "20px Kanit";
      ctx.fillText(`วิศวกร: ${playerName}`, canvasElement.width / 2, 205);

      ctx.fillStyle = "#facc15";
      ctx.font = "bold 28px Kanit";
      ctx.fillText(`คะแนนรวม: ${score} คะแนน`, canvasElement.width / 2, 255);

      ctx.fillStyle = "#3b82f6";
      ctx.beginPath();
      ctx.roundRect(canvasElement.width / 2 - 90, 310, 180, 45, 10);
      ctx.fill();

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 18px Kanit";
      ctx.fillText("เล่นอีกครั้ง", canvasElement.width / 2, 338);
    }

    canvasElement.addEventListener('click', (e) => {
      const rect = canvasElement.getBoundingClientRect();
      const clickY = e.clientY - rect.top;

      if (gameState === 'START' && clickY > 230 && clickY < 320) {
        startGame();
      } else if (gameState === 'GAMEOVER' && clickY > 280 && clickY < 370) {
        startGame();
      }
    });
  </script>
</body>
</html>
